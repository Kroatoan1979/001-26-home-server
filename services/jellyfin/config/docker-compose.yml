services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    network_mode: host
    volumes:
      - /home/ivan/docker/jellyfin/config:/config
      - /home/ivan/docker/jellyfin/cache:/cache
      - /mnt/dados/media/filmes:/media/filmes:ro
      - /mnt/dados/media/series:/media/series:ro
    restart: unless-stopped
    environment:
      - JELLYFIN_PublishedServerUrl=http://192.168.1.136:8096
