# Esqueleto — por validar na instalação real.
# Baseado no comando oficial de trial da FileCloud:
#   docker run --privileged -d -p 443:443 -p 80:80 filecloud/server
# --privileged é exigido pela imagem oficial (usada internamente para gerir serviços do próprio container).

services:
  filecloud:
    image: filecloud/server:latest
    container_name: filecloud
    privileged: true
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /mnt/dados/filecloud:/filecloud-data
