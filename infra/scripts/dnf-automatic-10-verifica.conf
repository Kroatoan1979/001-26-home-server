# /etc/systemd/system/dnf-automatic.service.d/10-verifica.conf — 2026-10-31.
# Depois de cada dnf-automatic, confirma kernels, initramfs e espaço no /boot (o dnf
# não falha quando o dracut falha). Se o dnf-verifica sair com 1, a unit fica "failed"
# e o drop-in global OnFailure= (tarefa 21) manda o alerta com o log.
[Service]
ExecStartPost=/usr/local/sbin/dnf-verifica
